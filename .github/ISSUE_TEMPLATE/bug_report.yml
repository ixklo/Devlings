name: Bug report
description: Something in Perch isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Found a security issue instead? Please use [private reporting](../../security/advisories/new) rather than a public issue.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Perch, go to Settings → About → Copy diagnostics, then paste here. This includes your OS, Perch version, Claude Code version and recent (redacted) logs, and is the single most useful thing you can attach.
      placeholder: Paste the output of "Copy diagnostics" here.
      render: text
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. Windows 11, macOS 15.1, Ubuntu 22.04. Skip this if it's already in the diagnostics above.
    validations:
      required: false
  - type: input
    id: perch-version
    attributes:
      label: Perch version
      description: Settings → About. Skip this if it's already in the diagnostics above.
    validations:
      required: false
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: "`claude --version`. Skip this if it's already in the diagnostics above."
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
