name: Linux build dependencies
description: >
  Installs the apt packages Devlings' Tauri build needs on Ubuntu (used by
  ci.yml's test and smoke jobs and by release.yml's build job, so the list
  only lives in one place).
inputs:
  extra-packages:
    description: 'Additional space-separated apt packages to install, e.g. "xvfb imagemagick" for the smoke job.'
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -e
        sudo apt-get update
        # $EXTRA_PACKAGES is deliberately unquoted: it's a space-separated
        # list of extra package names (or empty), not a single argument.
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          $EXTRA_PACKAGES
