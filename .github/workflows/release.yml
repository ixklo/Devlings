name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  version-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-version.mjs --tag ${{ github.ref_name }}

  build:
    needs: version-check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Perch ${{ github.ref_name }}"
          releaseBody: |
            Draft release, not yet published. Before hitting "Publish":

            1. Write the real notes using `.github/release-notes-template.md`
               and this version's entry in `CHANGELOG.md`.
            2. Confirm `SHA256SUMS.txt` and the build-provenance attestations
               were attached by the follow-up job on this tag's workflow run.
            3. Confirm this is meant to go out as Latest (or as a pre-release,
               for an `-rc` tag) before publishing.
          releaseDraft: ${{ !contains(github.ref_name, '-rc') }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'macos-latest'
        run: |
          set -e
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            echo "::error::no .app bundle found to verify"
            exit 1
          fi
          echo "Verifying ad-hoc signature on $APP"
          codesign -dv --verbose=2 "$APP"

  provenance:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir release-assets --skip-existing
      - name: Write SHA256SUMS.txt
        run: |
          set -e
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload SHA256SUMS.txt to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" release-assets/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
      - name: Attest build provenance for every asset
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"
