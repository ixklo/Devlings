name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  version-check:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-version.mjs --tag "$TAG"

  # Creates the (always draft) release up front, so the three platform
  # builds below attach assets to one release by id instead of each trying
  # to find-or-create a release by tag name, which raced (duplicate drafts,
  # and a latest.json read-modify-write race across the three parallel
  # jobs).
  create-release:
    needs: version-check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Perch $TAG" \
            --draft \
            --notes "$(cat <<'EOF'
          Draft release, still being built.

          Before hitting "Publish":

          1. Wait for this tag's release workflow run to finish. It attaches
             `SHA256SUMS.txt`, `latest.json` and a build-provenance
             attestation for every asset once all three platform builds
             succeed.
          2. Write the real notes using `.github/release-notes-template.md`
             and this version's entry in `CHANGELOG.md`.

          (An `-rc` tag publishes itself automatically as a pre-release,
          with a short placeholder body, once its build finishes — this
          draft-with-instructions text is only what non-`-rc` tags keep
          until a person publishes them.)
          EOF
          )"
          id=$(gh release view "$TAG" --repo "$REPO" --json databaseId --jq .databaseId)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    # tauri-action uploads the installers and updater bundles to the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the release created above rather than creating/finding
          # one by tag: three parallel jobs each doing the latter is exactly
          # what raced before. includeUpdaterJson is off here for the same
          # reason — the finalize job below builds latest.json once, after
          # every platform's .sig files are already uploaded.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}
      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'macos-latest'
        run: |
          set -e
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$APP" ]; then
            echo "::error::no .app bundle found to verify"
            exit 1
          fi
          echo "Verifying ad-hoc signature on $APP"
          codesign --verify --deep --strict "$APP"
          DV_OUTPUT=$(codesign -dv --verbose=2 "$APP" 2>&1)
          echo "$DV_OUTPUT"
          if ! echo "$DV_OUTPUT" | grep -q "Signature=adhoc"; then
            echo "::error::expected an ad-hoc signature (Signature=adhoc) but didn't find one"
            exit 1
          fi

  # Runs only once all three platform builds succeeded (a bad macOS
  # signature, for instance, blocks this and the release stays an
  # incomplete draft rather than getting published).
  finalize:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$TAG" --repo "$REPO" --dir release-assets --skip-existing
      # The release is still a draft: GitHub's by-tag API never returns drafts, and a draft's download URLs
      # point at a temporary "untagged-…" address. So list the assets by release id and build the URLs they
      # will have once the release is published under its tag.
      - name: Asset URLs as they will be once published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -e
          gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" > assets-raw.json
          jq --arg base "https://github.com/$REPO/releases/download/$TAG/" \
            '{assets: [.[] | {name, url: ($base + (.name | @uri))}]}' assets-raw.json > release-assets.json
          cat release-assets.json
      - name: Build latest.json
        run: node scripts/gen-latest-json.mjs --tag "$TAG" --assets-dir release-assets --assets-json release-assets.json --out release-assets/latest.json
      # Version-free copies of the four installers, so README and website links of the form
      # releases/latest/download/<name> never go stale. They get no .sig (latest.json above only
      # uses the versioned files), and SHA256SUMS.txt and the attestations below cover them too.
      - name: Stable download names
        run: node scripts/stable-assets.mjs --assets-dir release-assets
      - name: Write SHA256SUMS.txt
        run: |
          set -e
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload latest.json, SHA256SUMS.txt and the stable-name copies to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "$TAG" --repo "$REPO" --clobber \
            release-assets/latest.json \
            release-assets/SHA256SUMS.txt \
            release-assets/Perch-windows-x64-setup.exe \
            release-assets/Perch-macos-universal.dmg \
            release-assets/Perch-linux-x86_64.AppImage \
            release-assets/Perch-linux-amd64.deb
      - name: Attest build provenance for every asset
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"
      - name: Publish an -rc tag as a pre-release
        if: contains(env.TAG, '-rc')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false \
            --prerelease \
            --notes "Pre-release build $TAG, for QA. Not the final release notes — see CHANGELOG.md once this version reaches a non-rc tag."
