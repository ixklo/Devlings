[package]
name = "perch"
version = "1.2.3"
description = "Desktop pets for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "perch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# In-app updates (M1). Driven from Rust; the webview gets no updater permissions.
tauri-plugin-updater = "2"
log = "0.4"
semver = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
rand = "0.8"
dirs = "5"
tauri-plugin-log = "2"

# Windows toasts (S1): used directly so a click reaches Devlings' process. Same version notify-rust already pulls in.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
# The same windows crate tauri-winrt-notification uses: whether Windows will show our notifications, and the
# time since the last input (the welcome-back wave).
windows = { version = "0.61", features = ["UI_Notifications", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
ureq = "2"
