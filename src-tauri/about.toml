# cargo-about configuration, used by scripts/gen-third-party-notices.mjs to
# build THIRD_PARTY_NOTICES.md. Only normal (runtime) dependencies ship in
# the installers, so build- and dev-dependencies are excluded.
#
# Keep this allow-list in sync with the top-level deny.toml's
# [licenses].allow list.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
